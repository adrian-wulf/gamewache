[package]
name = "gamewache"
version = "0.1.0"
edition = "2024"
authors = ["Adrian Wulf <adrian@social-wulf.eu>"]
description = "Autonomous GameOps: Crash Sentinel, Deterministic Replay Blackbox, Remote CAS & AI MCP"
license = "MIT"

[lib]
name = "gamewache"
path = "src/lib.rs"

[[bin]]
name = "gamewache"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
blake3 = "1.6"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.1", features = ["v4"] }
zstd = "0.13"
